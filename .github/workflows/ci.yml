name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：package.json 的 packageManager(pnpm@11.0.8) 是唯一真源。
      # 两处都写会触发 action 报错「Multiple versions of pnpm specified」。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Portal literals（门户清单单一真源）
        run: pnpm --filter @autional/admin-console exec autional-check-portal-literals --root .

      # 生产构建需要部署环境变量（API_ORIGIN / VITE_GRAFANA_URL 等，缺一个就 fail-closed），
      # 那是发布链路的职责；这里只做类型检查，避免在 CI 里伪造部署环境。
      - name: Typecheck
        run: pnpm typecheck

      # 无障碍闸门（AC C-28 / ui-denominator G5·G6）：jsx-a11y recommended，0 error 才算过。
      # 单列一步的原因：本仓历史 lint 面从没跑过 a11y；先让它独立亮红/亮绿，
      # 不和 no-explicit-any 之类的存量噪音混在一起（试点通过后再随 DS 发版并入 pnpm lint）。
      - name: A11y lint
        run: pnpm --filter @autional/admin-console run lint:a11y
